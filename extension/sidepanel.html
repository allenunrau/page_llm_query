<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>On-Device LLM Queries</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header>
    <h1>On-Device LLM <small id="version" class="version"></small></h1>
    <span id="status" class="status" role="status">Checking model…</span>
  </header>

  <form id="query-form">
    <p id="subject" class="subject muted"></p>
    <label for="url-input" class="sr-only">URL to query (optional)</label>
    <input id="url-input" name="url" type="url" autocomplete="off" placeholder="Optional URL to query instead of the open page">
    <label for="query-input" class="sr-only">Query</label>
    <textarea id="query-input" name="query" autocomplete="off" rows="4" placeholder="Ask the on-device model… (Ctrl/Cmd+Enter to run)"></textarea>
    <label class="check"><input type="checkbox" id="cert-input" name="cert"> Ask about the site's HTTPS certificate instead of the page text</label>
    <div class="row">
      <button type="submit" id="run-btn" class="primary">Run</button>
      <button type="button" id="stop-btn" hidden>Stop</button>
      <button type="button" id="cert-btn">Show certificate</button>
    </div>
    <pre id="cert-view" hidden></pre>
    <progress id="download" max="1" hidden></progress>
  </form>

  <section>
    <div class="row between">
      <h2>History <span id="count" class="muted"></span></h2>
      <button type="button" id="clear-btn" class="danger-link">Delete all</button>
    </div>
    <ul id="history"></ul>
    <p id="empty" class="muted" hidden>No saved queries yet.</p>
  </section>

  <script src="certificate.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
